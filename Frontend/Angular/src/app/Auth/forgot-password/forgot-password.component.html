<main class="signin" [attr.data-render]="state.renderVersion()" [attr.data-lang]="i18n.lang()">
  <section class="signin-aside">
    <div class="brand-row">
      <span class="brand-mark">HR</span>
      <strong>{{ 'app.name' | t }}</strong>
    </div>
    <div class="signin-aside-copy">
      <h1>{{ 'auth.welcome' | t }}</h1>
      <p>{{ 'app.tagline' | t }}</p>
    </div>
  </section>

  <section class="signin-main">
    <div class="signin-card">
      <div class="signin-card-top">
        <div>
          <h2>{{ 'auth.forgotTitle' | t }}</h2>
          <p>{{ 'auth.forgotSub' | t }}</p>
        </div>
        <div class="lang-switch" role="group" [attr.aria-label]="'lang.label' | t">
          <button type="button" class="ghost-button lang-btn" [class.active]="i18n.lang() === 'en'" (click)="i18n.setLang('en')">
            {{ 'lang.en' | t }}
          </button>
          <button type="button" class="ghost-button lang-btn" [class.active]="i18n.lang() === 'km'" (click)="i18n.setLang('km')">
            {{ 'lang.km' | t }}
          </button>
        </div>
      </div>

      @if (!state.forgotRequested) {
        <form class="login-form" (ngSubmit)="state.submitForgotPassword($event)">
          <div class="field">
            <label for="reset-email">{{ 'auth.workEmail' | t }}</label>
            <input
              id="reset-email"
              name="email"
              type="email"
              [(ngModel)]="state.forgotEmail"
              autocomplete="username"
              placeholder="name@company.com"
              required>
          </div>
          <div class="field">
            <label for="reset-code">{{ 'auth.employeeCode' | t }}</label>
            <input
              id="reset-code"
              name="employeeCode"
              type="text"
              [(ngModel)]="state.forgotEmployeeCode"
              autocomplete="off"
              placeholder="EMP0001"
              required>
          </div>
          @if (state.forgotError) {
            <p class="error-text" role="alert">{{ state.forgotError }}</p>
          }
          <button type="submit" class="primary-button" [disabled]="state.forgotInProgress">
            {{ state.forgotInProgress ? ('auth.checking' | t) : ('auth.requestReset' | t) }}
          </button>
        </form>
      } @else {
        <p class="callout" role="status">{{ 'auth.forgotSent' | t }}</p>
      }

      <a class="auth-link signin-back" routerLink="/login">{{ 'auth.backToSignIn' | t }}</a>
    </div>
  </section>
</main>
